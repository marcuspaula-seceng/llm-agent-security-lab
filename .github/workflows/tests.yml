name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: guard unit tests (no model required)
        run: python -m unittest discover -s tests -v
      - name: publication gate (credential patterns only; disclosure terms stay private)
        run: python tools/publication_gate.py .
